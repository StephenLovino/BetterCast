name: Build Windows Receiver

on:
  push:
    paths:
      - 'Sources/BetterCastReceiverDesktop/**'
      - '.github/workflows/build-windows-receiver.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

# Only one Windows build per branch at a time.
#
# Without this, pushing twice in quick succession left two runs compiling the
# same vcpkg tree concurrently. The second started before the first had saved
# its cache, found nothing to restore, and died in the FFmpeg step — a green
# commit and the commit right after it failing for no reason of its own.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.7.0'
  VDD_VERSION: '25.7.23'  # Virtual Display Driver release tag
  VCPKG_SPEC: 'ffmpeg[x264,nvcodec,amf]:x64-windows'
  # Bump this whenever VCPKG_SPEC changes. Keying the cache on this rather than
  # on a hash of the whole workflow file means ordinary edits here no longer
  # throw away a 30-minute FFmpeg build.
  VCPKG_CACHE_TAG: 'ffmpeg-x264-nvcodec-amf-v1'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --modules qtmultimedia `
            --outputdir C:/Qt
          echo "Qt6_DIR=C:/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $env:GITHUB_ENV
          echo "C:/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          # Keyed on the package set, not on a hash of this file.
          key: vcpkg-x64-windows-${{ env.VCPKG_CACHE_TAG }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Install FFmpeg via vcpkg (x264 + hardware encoders)
        shell: pwsh
        run: |
          # nvcodec and amf pull in the NVENC and AMF encoders. Without them
          # avcodec_find_encoder_by_name("h264_nvenc") returns null and the
          # sender silently falls back to libx264 for every stream — three
          # concurrent 1080p60 software encodes will bury a laptop CPU, which
          # showed up as a black screen on the third receiver.
          vcpkg install "$env:VCPKG_SPEC" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Generate Windows icon (.ico)
        shell: pwsh
        run: |
          pip install Pillow
          # Round the corners before generating the .ico. The in-app logo is
          # masked at draw time, but the taskbar, desktop shortcut and Alt-Tab
          # all come from this file — so without it the icon stayed square
          # everywhere outside the app window. Radius is ~22% of the edge, which
          # approximates the macOS superellipse closely enough at icon sizes.
          python -c "
          from PIL import Image, ImageDraw
          src = Image.open('Sources/BetterCastReceiverDesktop/icon_256x256.png').convert('RGBA')
          size = max(src.size)
          src = src.resize((size, size), Image.LANCZOS)
          mask = Image.new('L', (size * 4, size * 4), 0)
          ImageDraw.Draw(mask).rounded_rectangle(
              [0, 0, size * 4 - 1, size * 4 - 1], radius=int(size * 4 * 0.22), fill=255)
          mask = mask.resize((size, size), Image.LANCZOS)  # supersampled = smooth edge
          out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          out.paste(src, (0, 0), mask)
          out.save('Sources/BetterCastReceiverDesktop/appicon.ico',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('rounded appicon.ico written from', size, 'px source')
          "

      - name: Configure CMake
        shell: pwsh
        run: |
          cd Sources/BetterCastReceiverDesktop
          mkdir build
          cd build
          # Ninja, not the Visual Studio generator. "Setup MSVC" above already puts the
          # x64 toolchain on PATH, so the compiler is found through the environment
          # rather than by looking up one specific Visual Studio version. Hardcoding
          # "Visual Studio 17 2022" is what broke this job: the runner image moved on,
          # CMake reported "could not find any instance of Visual Studio", and every
          # Windows build from v14 to v16 failed at configure. Nothing surfaced it
          # because the macOS release path does not depend on this workflow.
          # Ninja is single-config, so the build type is set here instead of at build
          # time and the binary lands in build/ rather than build/Release/.
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DENABLE_SENDER=ON `
            -DREQUIRE_TRANSLATIONS=ON

      - name: Build
        shell: pwsh
        run: |
          cd Sources/BetterCastReceiverDesktop/build
          cmake --build .

      - name: Download ADB platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "."
          if (Test-Path "platform-tools/adb.exe") {
            Write-Host "ADB downloaded successfully"
          } else {
            Write-Host "WARNING: adb.exe not found in download"
          }

      - name: Download Virtual Display Driver (VDD)
        shell: pwsh
        run: |
          $vddTag = "${{ env.VDD_VERSION }}"
          $baseUrl = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/${vddTag}"

          mkdir "vdd" -Force
          try {
            # Download the actual driver package (contains .inf + .dll for pnputil)
            $driverUrl = "${baseUrl}/VirtualDisplayDriver-x86.Driver.Only.zip"
            Write-Host "Downloading VDD driver from: $driverUrl"
            Invoke-WebRequest -Uri $driverUrl -OutFile "vdd-driver.zip" -MaximumRedirection 5
            Expand-Archive -Path "vdd-driver.zip" -DestinationPath "vdd-driver-extract"
            Get-ChildItem "vdd-driver-extract" -Recurse -File | ForEach-Object {
              Copy-Item $_.FullName "vdd/" -Force
            }

            # Also download VDD Control app (UI for managing virtual displays)
            $controlUrl = "${baseUrl}/VDD.Control.${vddTag}.zip"
            Write-Host "Downloading VDD Control from: $controlUrl"
            Invoke-WebRequest -Uri $controlUrl -OutFile "vdd-control.zip" -MaximumRedirection 5
            Expand-Archive -Path "vdd-control.zip" -DestinationPath "vdd-control-extract"
            Get-ChildItem "vdd-control-extract" -Recurse -File | ForEach-Object {
              Copy-Item $_.FullName "vdd/" -Force
            }

            $fileCount = (Get-ChildItem "vdd" -File).Count
            Write-Host "VDD: $fileCount files extracted"
            Get-ChildItem "vdd" | ForEach-Object { Write-Host "  $_" }

            # Verify we have the .inf file needed for driver installation
            $infFiles = Get-ChildItem "vdd" -Filter "*.inf"
            if ($infFiles.Count -eq 0) {
              Write-Host "WARNING: No .inf file found in VDD package"
            } else {
              Write-Host "VDD driver .inf found: $($infFiles.Name)"
            }
          } catch {
            Write-Host "WARNING: Failed to download VDD: $_"
            Write-Host "Installer will be built without VDD bundled"
          }

      - name: Package artifact
        shell: pwsh
        run: |
          mkdir artifact

          # Copy the exe
          Copy-Item "Sources/BetterCastReceiverDesktop/build/BetterCastReceiver.exe" "artifact/"

          # Run windeployqt to bundle Qt DLLs
          windeployqt --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw "artifact/BetterCastReceiver.exe"

          # Copy FFmpeg DLLs
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem "$vcpkgBin/*.dll" | ForEach-Object {
              Copy-Item $_.FullName "artifact/"
            }
          }

          # Bundle ADB (adb.exe + required DLLs)
          if (Test-Path "platform-tools/adb.exe") {
            Copy-Item "platform-tools/adb.exe" "artifact/"
            Copy-Item "platform-tools/AdbWinApi.dll" "artifact/" -ErrorAction SilentlyContinue
            Copy-Item "platform-tools/AdbWinUsbApi.dll" "artifact/" -ErrorAction SilentlyContinue
            Write-Host "ADB bundled into artifact"
          }

          # Copy app icon for runtime (embedded via Qt resource, but also keep as fallback)
          Copy-Item "Sources/BetterCastReceiverDesktop/appicon.ico" "artifact/" -ErrorAction SilentlyContinue

          # Bundle VDD files into portable artifact too
          if ((Test-Path "vdd") -and (Get-ChildItem "vdd" -File).Count -gt 0) {
            mkdir "artifact/VirtualDisplayDriver" -Force
            Copy-Item "vdd/*" "artifact/VirtualDisplayDriver/" -Force
            Write-Host "VDD files bundled into portable artifact"
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          # The same approach as build-glass-spike.yml, which stopped failing
          # once it moved to it.
          #
          # This step used to download from the nicehash/NSIS mirror and fall
          # back to winget. The mirror is unreliable, and the winget fallback
          # failed a build on 2026-09-15: the msstore source timed out, and
          # with no --source given winget refused to choose between sources
          # and exited 1. Use NSIS if the image already has it, install it from
          # Chocolatey (preinstalled on GitHub's Windows runners) if not, and
          # only then try winget - pinned to its own source so a Store outage
          # cannot break it.
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not $makensis -and (Test-Path "$nsisDir\makensis.exe")) {
            $makensis = "$nsisDir\makensis.exe"
          }
          if (-not $makensis) {
            Write-Host "NSIS is not on this runner image - installing it with Chocolatey"
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              Write-Host "choco install nsis failed with $LASTEXITCODE - trying winget"
              winget install --id NSIS.NSIS --exact --source winget --silent `
                --accept-source-agreements --accept-package-agreements
            }
            if (Test-Path "$nsisDir\makensis.exe") { $makensis = "$nsisDir\makensis.exe" }
          }
          if (-not $makensis) { throw "Could not install NSIS: makensis.exe not found in $nsisDir" }

          (Split-Path $makensis -Parent) >> $env:GITHUB_PATH

          # Assert it runs, not merely that a file exists.
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis is present at $makensis but would not run" }
          Write-Host "makensis: $makensis"

      - name: Build installer
        shell: pwsh
        run: |
          cd Sources/BetterCastReceiverDesktop

          # Copy artifact and vdd directories next to installer.nsi
          # (NSIS references files relative to the .nsi script)
          Copy-Item -Recurse "${{ github.workspace }}/artifact" "artifact"
          Copy-Item -Recurse "${{ github.workspace }}/vdd" "vdd"

          # Version comes from CMakeLists so the installer, the app's About box
          # and the update checker can never disagree. They already had: the
          # binary reported 1.0.0 while the published release said 1.0.1.
          # The Windows version (windows-<x.y.z> release line), not the macOS one.
          $m = Select-String -Path CMakeLists.txt -Pattern 'set\(BETTERCAST_WINDOWS_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)'
          if (-not $m) { throw "Could not read BETTERCAST_WINDOWS_VERSION out of CMakeLists.txt" }
          $bcVersion = $m.Matches[0].Groups[1].Value
          Write-Host "Installer version: $bcVersion"

          # Build the installer
          makensis /DPRODUCT_VERSION="$bcVersion" installer.nsi

          # Move installer to workspace root
          Move-Item "BetterCast-Setup-*.exe" "${{ github.workspace }}/"

      - name: Upload portable artifact
        # Independent of the installer: a failing NSIS step should not withhold
        # a portable build that packaged fine.
        if: always() && hashFiles('artifact/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BetterCastReceiver-Windows-x64
          path: artifact/
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BetterCast-Setup-Windows-x64
          path: BetterCast-Setup-*.exe
          retention-days: 30
